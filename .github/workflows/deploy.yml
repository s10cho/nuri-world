name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

# Pages 배포를 직렬화 — 동시 배포 큐 충돌·재시도 방지 (진행 중 배포는 취소하지 않고 대기)
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url || steps.deploy-retry.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install (clean)
        run: npm ci

      # Vite 빌드 — 콘텐츠 해시 파일명으로 캐시버스팅을 대체(별도 스탬프 불필요),
      # base=/nuri-world/ 로 서브패스 경로 처리, dist/로 산출.
      - name: Build (Vite)
        run: npm run build

      - uses: actions/configure-pages@v5

      - name: Upload site artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: dist

      # 1차 배포. deploy-pages는 GitHub Pages 백엔드의 일시적 오류
      # ("try again later")로 간헐 실패하므로 continue-on-error로 잡고 재시도한다.
      - name: Deploy to GitHub Pages
        id: deploy
        continue-on-error: true
        uses: actions/deploy-pages@v4

      - name: Wait before retry
        if: steps.deploy.outcome == 'failure'
        run: sleep 20

      # 2차 시도 — 1차가 일시 실패했을 때만. 여기서 실패하면 job도 실패(진짜 문제).
      - name: Deploy to GitHub Pages (retry)
        id: deploy-retry
        if: steps.deploy.outcome == 'failure'
        uses: actions/deploy-pages@v4
