<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
  <title>누리의 한글 왕국 — 글자를 되찾는 모험</title>
  <meta name="description" content="미취학 아동을 위한 한글 학습 모험 게임. 누리와 함께 자음, 모음, 글자, 단어를 배워요!">

  <!-- PWA / 전체화면 (manifest는 vite-plugin-pwa가 생성·주입) -->
  <meta name="theme-color" content="#59b8f2">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="한글 왕국">
  <link rel="apple-touch-icon" href="/assets/icons/icon-192.png">
  <link rel="icon" type="image/png" sizes="192x192" href="/assets/icons/icon-192.png">

  <!-- 어린이 친화 둥근 한글 폰트 -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Jua&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div id="app"></div>

  <!-- 세로 화면 회전 안내 (작은 화면 전용) -->
  <div id="rotate-hint">
    <div class="phone">📱</div>
    <div>화면을 옆으로 돌리면<br>더 재미있게 놀 수 있어요!</div>
    <button class="btn-round dismiss" id="rotate-dismiss">그냥 할래요</button>
  </div>

  <script type="module" src="js/app.js"></script>
</body>
</html>
