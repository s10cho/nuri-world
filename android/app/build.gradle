apply plugin: 'com.android.application'

// 릴리스 서명 비밀키는 android/keystore.properties(gitignore됨)에서 읽는다.
// 파일이 없으면 서명하지 않으므로 디버그 빌드·CI 클론은 그대로 동작한다.
// 생성법: keytool -genkey -v -keystore release.keystore -alias nuri -keyalg RSA -keysize 2048 -validity 10000
def keystorePropsFile = rootProject.file("keystore.properties")
def keystoreProps = new Properties()
if (keystorePropsFile.exists()) {
    keystoreProps.load(new FileInputStream(keystorePropsFile))
}

// versionCode 는 android/version-code.txt 한 곳에서만 관리한다.
// 정수여야 하고 되돌릴 수 없으며, 스토어에 올리는 파일마다 이전보다 커야 한다.
// `npm run release:firebase` 가 빌드 전에 이 파일을 +1 해 준다(tools/bump-version-code.mjs).
// 손으로 고쳐도 되지만, 두 곳에 적어 두면 릴리스마다 어긋나므로 여기서 읽기만 한다.
def nuriVersionCodeFile = rootProject.file("version-code.txt")
def nuriVersionCode = nuriVersionCodeFile.exists()
    ? nuriVersionCodeFile.text.trim().toInteger()
    : 1

android {
    namespace = "com.sycho.nuri.hangulkingdom"
    compileSdk = rootProject.ext.compileSdkVersion
    defaultConfig {
        applicationId "com.sycho.nuri.hangulkingdom"
        minSdkVersion rootProject.ext.minSdkVersion
        targetSdkVersion rootProject.ext.targetSdkVersion
        // versionName 은 package.json 하나만 고치면 되도록 여기서 읽는다.
        // (두 곳에 손으로 적어 두면 릴리스마다 어긋난다 — 실제로 1.0 vs 1.0.0 으로 갈렸다)
        versionCode nuriVersionCode
        versionName new groovy.json.JsonSlurper().parse(rootProject.file("../package.json")).version
        testInstrumentationRunner "androidx.test.runner.AndroidJUnitRunner"
        aaptOptions {
             // Files and dirs to omit from the packaged assets dir, modified to accommodate modern web apps.
             // Default: https://android.googlesource.com/platform/frameworks/base/+/282e181b58cf72b6ca770dc7ca5f91f135444502/tools/aapt/AaptAssets.cpp#61
            ignoreAssetsPattern = '!.svn:!.git:!.ds_store:!*.scc:.*:!CVS:!thumbs.db:!picasa.ini:!*~'
        }
    }
    signingConfigs {
        release {
            if (keystorePropsFile.exists()) {
                // 경로는 keystore.properties 가 있는 android/ 기준으로 푼다.
                // file(...) 은 모듈 폴더(android/app/) 기준이라, DEPLOY.md 가 안내하는
                // android/release.keystore 를 찾지 못하고 서명 단계에서 실패했다.
                storeFile rootProject.file(keystoreProps['storeFile'])
                storePassword keystoreProps['storePassword']
                keyAlias keystoreProps['keyAlias']
                keyPassword keystoreProps['keyPassword']
            }
        }
    }
    buildTypes {
        release {
            // keystore.properties가 있을 때만 릴리스 서명 적용(없으면 미서명 산출물)
            if (keystorePropsFile.exists()) {
                signingConfig signingConfigs.release
            }
            minifyEnabled false
            proguardFiles getDefaultProguardFile('proguard-android.txt'), 'proguard-rules.pro'
        }
    }
}

// 키스토어가 없으면 릴리스 산출물이 '미서명'으로 조용히 만들어진다. Gradle 은 BUILD SUCCESSFUL 을
// 찍고 43MB짜리 AAB 까지 내놓지만 Play 는 서명 없는 번들을 거부한다 — 업로드하는 순간에야 알게 된다.
// 그래서 릴리스 산출물을 만드는 작업일 때만, 빌드를 시작하기 전에 끊는다.
// (디버그 빌드와 CI 클론은 영향을 받지 않는다.)
gradle.taskGraph.whenReady { graph ->
    def buildsRelease = graph.allTasks.any {
        it.path.endsWith(':bundleRelease') || it.path.endsWith(':assembleRelease')
    }
    if (!buildsRelease) return

    if (!keystorePropsFile.exists()) {
        throw new GradleException(
            "릴리스 서명 설정이 없습니다: android/keystore.properties\n" +
            "  서명하지 않은 AAB/APK 는 Play 에 올릴 수 없습니다.\n" +
            "  1) cd android && keytool -genkey -v -keystore release.keystore -alias nuri -keyalg RSA -keysize 2048 -validity 10000\n" +
            "  2) android/keystore.properties.example 를 복사해 keystore.properties 로 만들고 값 채우기\n" +
            "  자세한 내용은 DEPLOY.md 3장 참조. (비밀번호를 잃으면 앱 업데이트가 영구 불가하니 백업할 것)")
    }

    def missing = ['storeFile', 'storePassword', 'keyAlias', 'keyPassword'].findAll { !keystoreProps[it] }
    if (missing) {
        throw new GradleException("android/keystore.properties 에 값이 빠졌습니다: ${missing.join(', ')}")
    }
    def store = rootProject.file(keystoreProps['storeFile'])
    if (!store.exists()) {
        throw new GradleException("키스토어 파일을 찾을 수 없습니다: ${store}\n  keystore.properties 의 storeFile 경로를 확인하세요.")
    }
}

repositories {
    flatDir{
        dirs '../capacitor-cordova-android-plugins/src/main/libs', 'libs'
    }
}

dependencies {
    implementation fileTree(include: ['*.jar'], dir: 'libs')
    implementation "androidx.appcompat:appcompat:$androidxAppCompatVersion"
    implementation "androidx.coordinatorlayout:coordinatorlayout:$androidxCoordinatorLayoutVersion"
    implementation "androidx.core:core-splashscreen:$coreSplashScreenVersion"
    implementation project(':capacitor-android')
    testImplementation "junit:junit:$junitVersion"
    androidTestImplementation "androidx.test.ext:junit:$androidxJunitVersion"
    androidTestImplementation "androidx.test.espresso:espresso-core:$androidxEspressoCoreVersion"
    implementation project(':capacitor-cordova-android-plugins')
}

apply from: 'capacitor.build.gradle'

try {
    def servicesJSON = file('google-services.json')
    if (servicesJSON.text) {
        apply plugin: 'com.google.gms.google-services'
    }
} catch(Exception e) {
    logger.info("google-services.json not found, google-services plugin not applied. Push Notifications won't work")
}
